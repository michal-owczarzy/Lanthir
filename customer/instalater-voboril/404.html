<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Stránka nenalezena — Instalatér Vobořil</title>
<meta name="theme-color" content="#0C100D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C100D'/%3E%3Cpath d='M41 12a13 13 0 0 0-13 21L12 49a5 5 0 0 0 7 7l16-16a13 13 0 0 0 17-17l-8 8-6-2-2-6 8-8a13 13 0 0 0-3-3Z' fill='none' stroke='%236E9C42' stroke-width='3.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --basalt:#0C100D; --basalt-2:#141A15; --ink:#F2F5F1; --ink-dim:#98A69A;
  --moss:#6E9C42; --moss-hi:#93C75B; --copper:#C08A4E;
  --line:rgba(242,245,241,.11);
  --display:'Archivo',system-ui,sans-serif; --sans:'Manrope',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--basalt);color:var(--ink);line-height:1.65;
  min-height:100svh;display:grid;place-items:center;padding:clamp(24px,6vw,64px);
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--moss-hi);outline-offset:3px;border-radius:2px}
.wrap{max-width:660px;width:100%}
.mark{display:flex;align-items:center;gap:11px;margin-bottom:clamp(32px,7vh,64px)}
.mark svg{flex:none;color:var(--moss-hi)}
.mark .w{width:30px;height:30px}
.mark .t{width:34px;height:30px}
.mark span{font-family:var(--display);font-weight:800;font-stretch:106%;font-size:18px;
  letter-spacing:-.01em;line-height:1;white-space:nowrap}
.mark b{color:var(--moss-hi)}
.label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.19em;
  text-transform:uppercase;color:var(--moss-hi);display:inline-flex;align-items:center;gap:10px}
.label::before{content:"";width:22px;height:1px;background:currentColor;opacity:.55}
h1{font-family:var(--display);font-weight:700;font-stretch:112%;letter-spacing:-.025em;
  line-height:1.04;font-size:clamp(2.1rem,6vw,3.6rem);margin:18px 0 20px;text-wrap:balance}
p{color:var(--ink-dim);max-width:46ch;font-weight:300;font-size:clamp(1rem,1.4vw,1.12rem)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(28px,5vh,40px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:11px;min-height:52px;
  padding:0 28px;border-radius:999px;border:1px solid transparent;font-size:15px;font-weight:600;
  transition:transform .35s var(--ease),background-color .3s,border-color .3s,color .3s}
.btn svg{width:18px;height:18px}
.btn--fill{background:var(--moss-hi);color:#0A0D0A}
.btn--fill:hover{background:#A6D96C;transform:translateY(-1px)}
.btn--ghost{border-color:var(--line);color:var(--ink)}
.btn--ghost:hover{border-color:var(--moss-hi);color:var(--moss-hi);transform:translateY(-1px)}
.pipe{margin-top:clamp(36px,7vh,56px);display:flex;align-items:center;gap:14px;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.pipe s{flex:1;height:1px;background:var(--line);text-decoration:none}
.pipe i{width:8px;height:8px;border-radius:50%;background:var(--copper);font-style:normal;flex:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="wrap">
  <a href="/" class="mark" aria-label="Instalatér Vobořil koupelny — úvod">
    <svg class="w" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.6"
         stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M41 12a13 13 0 0 0-13 21L12 49a5 5 0 0 0 7 7l16-16a13 13 0 0 0 17-17l-8 8-6-2-2-6 8-8a13 13 0 0 0-3-3Z"/>
    </svg>
    <span>Instalatér <b>Vobořil</b> koupelny</span>
    <svg class="t" viewBox="128 8 98 88" fill="none" stroke="currentColor" stroke-width="5.2"
         stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M132 40h84v13a30 30 0 0 1-30 30h-24a30 30 0 0 1-30-30V40Z"/>
      <path d="M152 83l-5 7M196 83l5 7"/>
      <path d="M196 14h20a5 5 0 0 1 0 10h-20a5 5 0 0 1 0-10Z"/>
      <path d="M200 27v7M208 27v9M216 27v7"/>
    </svg>
  </a>

  <p class="label">Chyba 404</p>
  <h1>Tahle stránka tu neteče.</h1>
  <p>
    Odkaz vedl na stránku, která na webu není — nejspíš je starý nebo v adrese chybí písmeno.
    Zkuste to z úvodní stránky, nebo rovnou zavolejte.
  </p>

  <div class="cta">
    <a class="btn btn--fill" href="tel:+420604581537">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/>
      </svg>
      Zavolat 604 581 537
    </a>
    <a class="btn btn--ghost" href="/">Zpět na úvod</a>
  </div>

  <p class="pipe"><i></i> Ústí nad Labem a okolí <s></s></p>
</main>
</body>
</html>
