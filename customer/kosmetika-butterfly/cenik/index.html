<script>
/* Záložka se vybere ještě před prvním vykreslením (kvůli přechodu stránek: nadpis
   oboru musí existovat, aby na něj mohl „přetéct“ nadpis karty z úvodu). */
(function(){
  var zal = document.getElementById('zalozky'), panel = document.getElementById('panel');
  var id = (location.hash || '').slice(1); if (!BF.CENIK.some(function(k){ return k.id === id; })) id = BF.CENIK[0].id;
  zal.innerHTML = BF.CENIK.map(function(k){ return '<button type="button" role="tab" id="t-' + k.id + '" aria-controls="panel" aria-selected="' + (k.id === id) + '" data-id="' + k.id + '">' + k.nazev + '</button>'; }).join('');
  BF.panel = function(kid){
    var k = BF.CENIK.filter(function(x){ return x.id === kid; })[0];
    panel.setAttribute('aria-labelledby', 't-' + k.id);
    panel.innerHTML = '<h2 class="disp" data-vt-cil="' + k.id + '">' + k.nazev + '</h2>' + k.skupiny.map(function(s, si){
      return '<div class="skupina"><h3>' + s.n + '</h3><div class="radky">' + s.p.map(function(p, pi){
        var iid = k.id + '-' + si + '-' + pi;
        var full = s.n.indexOf(p[0]) === 0 || s.p.length === 1 && s.n === p[0] ? p[0] : s.n + ' – ' + p[0];
        return '<div class="radek" data-id="' + iid + '"><span class="n">' + p[0] + (p[2] ? '<small>' + p[2] + '</small>' : '') + '</span><span class="c num">' + p[1] + ' Kč</span>' +
          '<button class="pridat" type="button" aria-pressed="' + BF.vyber.ma(iid) + '" data-n="' + full.replace(/"/g, '&quot;') + '" data-c="' + p[1] + '" aria-label="Přidat do rezervace: ' + p[0] + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>';
      }).join('') + '</div>' + (s.pozn ? '<p class="pozn">' + s.pozn + '</p>' : '') + '</div>';
    }).join('') + '<p class="cenik-pozn">Přesnou cenu ošetření s rozpětím domluvíme ve studiu.</p>';
  };
  BF.panel(id);
})();
</script>
<script src="../js/gsap.min.js"></script>
<script src="../js/ScrollTrigger.min.js"></script>
<script>
window.INTRO_EXTRA = function(tl, root, lock){
  var v = root.querySelectorAll('.intro-vetev path');
  v.forEach(function(el){ var L = Math.ceil(el.getTotalLength()) + 1; gsap.set(el, {strokeDasharray:L + ' ' + L, strokeDashoffset:L}); });
  tl.to(v, {strokeDashoffset:0, duration:1.3, ease:'power2.inOut', stagger:.12}, 0)
    .to(lock.querySelector('svg'), {scaleX:.55, transformOrigin:'50% 50%', duration:.16, yoyo:true, repeat:3, ease:'sine.inOut'}, 1.05);
};
</script>
<script src="../js/intro.js"></script>
<script src="../js/web.js"></script>
<script>
(function(){
  var RM = BF.RM, hasG = BF.hasG, zal = document.getElementById('zalozky'), panel = document.getElementById('panel');

  /* přepnutí záložky: View Transition v rámci stránky (panel odjede a nový přijede) */
  function prepni(id){
    zal.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.id === id); });
    history.replaceState(null, '', '#' + id);
    var zmena = function(){ BF.panel(id); if (BF.hasG && !RM) gsap.from('#panel .radek', {y:10, opacity:0, duration:.35, stagger:.012, ease:'power2.out', delay:.15}); };
    if (document.startViewTransition && !RM) document.startViewTransition(zmena); else zmena();
  }
  zal.addEventListener('click', function(e){ var b = e.target.closest('button'); if (b && b.getAttribute('aria-selected') !== 'true') prepni(b.dataset.id); });
  zal.addEventListener('keydown', function(e){
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var bs = [].slice.call(zal.querySelectorAll('button')), i = bs.findIndex(function(b){ return b.getAttribute('aria-selected') === 'true'; });
    var n = bs[(i + (e.key === 'ArrowRight' ? 1 : bs.length - 1)) % bs.length]; n.focus(); prepni(n.dataset.id);
  });

  /* plus u položky: přidá / odebere, řádek se rozsvítí, počet v liště poskočí */
  panel.addEventListener('click', function(e){
    var b = e.target.closest('.pridat'); if (!b) return;
    var r = b.closest('.radek'), on = BF.vyber.prepni({id:r.dataset.id, n:b.dataset.n, c:b.dataset.c});
    b.setAttribute('aria-pressed', on);
    if (on){ r.classList.add('svit'); setTimeout(function(){ r.classList.remove('svit'); }, 600); BF.toast('Přidáno do rezervace'); }
  });

  var lista = document.getElementById('lista');
  BF.vyber.sleduj(function(l){
    document.getElementById('l-pocet').textContent = l.length;
    document.getElementById('l-suma').textContent = (BF.vyber.rozpeti() ? 'od ' : '') + BF.fmt(BF.vyber.soucet()) + ' Kč';
    lista.classList.toggle('on', l.length > 0);
  });

  if (!hasG) return;
  gsap.matchMedia().add('(prefers-reduced-motion: no-preference)', function(){
    afterIntro(function(){ gsap.to('[data-h]', {opacity:1, y:0, duration:.7, stagger:.08, ease:'power3.out'}); gsap.from('.skupina', {y:20, opacity:0, duration:.6, stagger:.06, ease:'power3.out', delay:.2}); });
  });
})();
</script>
