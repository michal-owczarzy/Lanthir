<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Děkujeme za poptávku | Lanthir</title>
  <!-- a confirmation page has no business in search results -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">

  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..600&family=Inter:wght@200;400;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..600&family=Inter:wght@200;400;600&family=JetBrains+Mono:wght@400;500&display=swap">
  </noscript>

  <style>
    .ty {
      position: relative;
      min-height: 100vh; min-height: 100svh;
      display: flex; align-items: center;
      padding: 120px 0 90px;
      overflow: hidden; isolation: isolate;
    }
    .ty::before {
      content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(66% 52% at 22% 6%,  rgba(54,240,214,.14), transparent 60%),
        radial-gradient(60% 50% at 86% 94%, rgba(112,96,255,.18), transparent 62%);
    }
    .ty > .container { position: relative; z-index: 1; width: 100%; max-width: 780px; }

    /* the tick draws itself once, then sits still */
    .ty-mark {
      width: 74px; height: 74px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(54,240,214,.1);
      box-shadow: inset 0 0 0 1.5px rgba(54,240,214,.45), 0 0 34px -6px rgba(54,240,214,.35);
      margin-bottom: var(--s2);
    }
    .ty-mark svg { width: 34px; height: 34px; color: var(--spark); }
    .ty-mark path { stroke-dasharray: 40; stroke-dashoffset: 40; }
    body.ready .ty-mark path { animation: tyDraw .6s var(--e-out) .35s forwards; }
    @keyframes tyDraw { to { stroke-dashoffset: 0; } }

    .ty .lede { margin-top: var(--s1); }
    .ty .row { margin-top: var(--s2); }
    .ty-next {
      margin-top: var(--s3); padding-top: var(--s1);
      border-top: 1px solid var(--hair);
      display: flex; flex-wrap: wrap; gap: 12px clamp(28px, 5vw, 56px);
    }
    .ty-next div { display: flex; flex-direction: column; gap: 6px; }
    .ty-next span {
      font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em;
      text-transform: uppercase; color: var(--dim);
    }
    .ty-next a, .ty-next p { font-size: 17px; font-weight: 200; color: var(--ink); }
    .ty-next a { min-height: 44px; display: inline-flex; align-items: center; transition: color .25s var(--e-out); }
    .ty-next a:hover { color: var(--spark); }

    .rise { opacity: 0; transform: translate3d(0, 20px, 0); transition: opacity .6s var(--e-out), transform .62s var(--e-spring); }
    body.ready .rise { opacity: 1; transform: none; }
    body.ready .rise:nth-child(2) { transition-delay: .06s; }
    body.ready .rise:nth-child(3) { transition-delay: .12s; }
    body.ready .rise:nth-child(4) { transition-delay: .18s; }
    body.ready .rise:nth-child(5) { transition-delay: .24s; }
    @media (prefers-reduced-motion: reduce) {
      .rise { opacity: 1 !important; transform: none !important; }
      .ty-mark path { stroke-dashoffset: 0; animation: none !important; }
    }
    @media (max-width: 560px) {
      .ty { padding: 96px 0 70px; }
      .ty-mark { width: 62px; height: 62px; }
      .ty-mark svg { width: 28px; height: 28px; }
      .ty-next a, .ty-next p { font-size: 16px; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/logo-mark.svg" alt="" class="logo-img">
        <span class="logo-text">Lanthir</span>
      </a>
    </div>
  </nav>

  <main class="ty">
    <div class="container">
      <div class="ty-mark rise" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1 class="h2 rise" data-i18n="t.h">Děkujeme. <em>Poptávku máme.</em></h1>
      <p class="lede rise" data-i18n="t.p">Zprávu jsme dostali a už si ji čteme. Ozveme se vám co nejdříve na e-mail, který jste uvedli.</p>
      <div class="row rise">
        <a href="/" class="btn btn--solid" data-i18n="t.b1">Zpět na úvod</a>
        <a href="/#reference" class="btn btn--ghost" data-i18n="t.b2">Prohlédnout reference</a>
      </div>
      <div class="ty-next rise">
        <div>
          <span data-i18n="t.n1">Potřebujete rychleji?</span>
          <a href="tel:+420725528165">+420 725 528 165</a>
        </div>
        <div>
          <span data-i18n="t.n2">E-mail</span>
          <a href="mailto:kontakt@lanthir.cz">kontakt@lanthir.cz</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var T = {
        cs: {
          't.h': 'Děkujeme. <em>Poptávku máme.</em>',
          't.p': 'Zprávu jsme dostali a už si ji čteme. Ozveme se vám co nejdříve na e-mail, který jste uvedli.',
          't.b1': 'Zpět na úvod', 't.b2': 'Prohlédnout reference',
          't.n1': 'Potřebujete rychleji?', 't.n2': 'E-mail'
        },
        en: {
          't.h': 'Thank you. <em>We have your enquiry.</em>',
          't.p': 'Your message has arrived and we are already reading it. We will get back to you as soon as we can, at the e-mail address you gave us.',
          't.b1': 'Back to home', 't.b2': 'See our work',
          't.n1': 'Need us sooner?', 't.n2': 'E-mail'
        },
        pl: {
          't.h': 'Dziękujemy. <em>Mamy Twoje zapytanie.</em>',
          't.p': 'Wiadomość dotarła i już ją czytamy. Odezwiemy się najszybciej, jak to możliwe, na podany adres e-mail.',
          't.b1': 'Wróć na stronę główną', 't.b2': 'Zobacz realizacje',
          't.n1': 'Potrzebujesz szybciej?', 't.n2': 'E-mail'
        }
      };
      var lang = 'cs';
      try { lang = localStorage.getItem('lanthir-lang') || 'cs'; } catch (e) {}
      if (!T[lang]) lang = 'cs';
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var v = T[lang][el.dataset.i18n];
        if (v !== undefined) el.innerHTML = v;
      });
      requestAnimationFrame(function () { document.body.classList.add('ready'); });
      setTimeout(function () { document.body.classList.add('ready'); }, 350);

      /* conversion signal, only if the visitor already accepted analytics on
         the main site (gtag is loaded there, not here) */
      if (window.parent === window && typeof window.gtag === 'function') {
        window.gtag('event', 'generate_lead', { method: 'contact_form' });
      }
    })();
  </script>
</body>
</html>
